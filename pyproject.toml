[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "storefront-tenant-sms-campaigns"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi==0.116.1", "pydantic==2.11.7", "uvicorn==0.35.0"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

